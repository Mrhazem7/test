<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hazm Fit | تطبيق الابطال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        app: {
                            bg: '#121212',
                            surface: '#1c1c1e',
                            surfaceAlt: '#2c2c2e',
                            primary: '#4ade80',
                            primaryDark: '#22c55e',
                            macroP: '#3b82f6', 
                            macroC: '#a855f7', 
                            macroF: '#f59e0b', 
                            water: '#38bdf8',
                            warning: '#854d0e',
                            textMain: '#f3f4f6',
                            textMuted: '#9ca3af'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #f3f4f6; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-family: 'Cairo', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        input[type="checkbox"] { appearance: none; background-color: #2c2c2e; margin: 0; width: 1.5em; height: 1.5em; border-radius: 0.4em; display: grid; place-content: center; cursor: pointer; transition: all 0.2s ease; }
        input[type="checkbox"]::before { content: ""; width: 0.8em; height: 0.8em; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(0); transition: 120ms transform ease-in-out; background-color: #121212; }
        input[type="checkbox"]:checked { background-color: #4ade80; }
        input[type="checkbox"]:checked::before { transform: scale(1); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-screen flex justify-center pb-12">
    <div class="w-full max-w-md px-4 pt-6">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold mb-1 flex items-center justify-center gap-2">💪 Hazm Fit</h1>
            <p class="text-app-textMuted text-xs tracking-wide uppercase">BODY RECOMPOSITION</p>
        </header>

        <div class="grid grid-cols-3 gap-2 bg-app-surface p-1.5 rounded-xl mb-6 border border-app-surfaceAlt">
            <button onclick="switchTab('nutrition')" id="btn-nutrition" class="py-2.5 text-sm font-bold rounded-lg bg-app-primary text-app-bg shadow-sm">التغذية</button>
            <button onclick="switchTab('workouts')" id="btn-workouts" class="py-2.5 text-sm font-bold rounded-lg text-app-textMuted hover:text-white">التمارين</button>
            <button onclick="switchTab('tracking')" id="btn-tracking" class="py-2.5 text-sm font-bold rounded-lg text-app-textMuted hover:text-white">المتابعة</button>
        </div>

        <div class="bg-app-surface border border-app-primary/30 rounded-xl p-3.5 mb-6 text-center shadow-md animate-fade-in">
            <span class="text-[10px] font-bold text-app-primary block mb-1">💡 رسالة اليوم لتحفيزك</span>
            <p id="motivation-text" class="text-xs text-app-textMain font-medium leading-relaxed"></p>
        </div>

        <!-- NUTRITION -->
        <section id="sec-nutrition" class="block animate-fade-in">
            <div id="nutrition-container"></div>
        </section>

        <!-- WORKOUTS -->
        <section id="sec-workouts" class="hidden animate-fade-in">
            <div class="grid grid-cols-1 gap-3 mb-4">
                <div class="bg-app-surface rounded-2xl p-4 border border-app-surfaceAlt flex items-center justify-between">
                    <span class="text-xs font-bold text-white">⏱️ مؤقت الراحة (60 ثانية)</span>
                    <div class="flex items-center gap-3">
                        <span id="timer-display" class="text-lg font-black text-app-primary font-mono">01:00</span>
                        <button onclick="startWorkoutTimer()" id="timer-btn" class="bg-app-primary text-app-bg text-xs font-bold px-3 py-2 rounded-xl">بدء</button>
                        <button onclick="resetWorkoutTimer()" class="bg-app-surfaceAlt text-white text-xs px-2.5 py-2 rounded-xl">إعادة</button>
                    </div>
                </div>
            </div>
            <div id="workouts-container"></div>
        </section>

        <!-- TRACKING -->
        <section id="sec-tracking" class="hidden animate-fade-in">
            <div class="bg-app-surface rounded-2xl p-6 border border-app-surfaceAlt shadow-lg mb-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-app-textMuted mb-2 text-right">التاريخ</label>
                    <input type="date" id="today-date" class="w-full bg-app-bg text-app-textMain rounded-xl p-3 border border-app-surfaceAlt font-sans">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-app-textMuted mb-2 text-right">الوزن (كجم)</label>
                    <input type="number" id="input-weight" step="0.1" class="w-full bg-app-bg text-app-textMain rounded-xl p-3 border border-app-surfaceAlt text-right font-sans" dir="rtl">
                </div>
                <button id="btn-save" class="w-full bg-app-primary text-app-bg font-bold text-lg py-3 rounded-xl mt-2">حفظ اليوم</button>
            </div>
            <div id="history-section" class="hidden pb-10">
                <h3 class="text-sm font-bold text-app-textMain mb-3 px-2">سجل الأيام السابقة</h3>
                <div id="history-container" class="space-y-3"></div>
            </div>
        </section>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-app-surface border border-app-surfaceAlt text-app-textMain font-bold px-6 py-3 rounded-full shadow-2xl transition-all duration-300 translate-y-10 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span class="text-app-primary text-xl" id="toast-icon">✓</span>
        <span id="toast-msg">تم الحفظ بنجاح! 🦾</span>
    </div>

    <!-- MACROS MODAL -->
    <div id="modal-macros" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-app-surface w-full max-w-sm rounded-2xl p-6 border border-app-surfaceAlt shadow-2xl space-y-4">
            <h2 class="text-xl font-bold text-white">تعديل الهدف اليومي</h2>
            <div><label class="text-xs text-app-textMuted">السعرات</label><input type="number" id="edit-cal" class="w-full bg-app-bg text-white p-3 rounded-xl border border-app-surfaceAlt text-right font-sans"></div>
            <div class="grid grid-cols-3 gap-2">
                <div><label class="text-[10px] text-app-textMuted">دهون</label><input type="number" id="edit-fats" class="w-full bg-app-bg text-white p-2 rounded-xl border border-app-surfaceAlt text-center font-sans"></div>
                <div><label class="text-[10px] text-app-textMuted">كارب</label><input type="number" id="edit-carbs" class="w-full bg-app-bg text-white p-2 rounded-xl border border-app-surfaceAlt text-center font-sans"></div>
                <div><label class="text-[10px] text-app-textMuted">برو</label><input type="number" id="edit-pro" class="w-full bg-app-bg text-white p-2 rounded-xl border border-app-surfaceAlt text-center font-sans"></div>
            </div>
            <div class="flex gap-2"><button onclick="saveMacros()" class="flex-1 bg-app-primary text-app-bg py-3 rounded-xl font-bold">حفظ</button><button onclick="closeMacroEdit()" class="flex-1 bg-app-bg text-white py-3 rounded-xl border border-app-surfaceAlt">إلغاء</button></div>
        </div>
    </div>

    <!-- MEAL MODAL -->
    <div id="modal-meal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-app-surface w-full max-w-sm rounded-2xl p-6 border border-app-surfaceAlt shadow-2xl space-y-4">
            <h2 class="text-xl font-bold text-white">تعديل الوجبة</h2>
            <div><label class="text-xs text-app-textMuted">اسم الوجبة</label><input type="text" id="edit-meal-title" class="w-full bg-app-bg text-white p-3 rounded-xl border border-app-surfaceAlt text-right font-sans" dir="rtl"></div>
            <div>
                <div class="flex justify-between items-center mb-1"><label class="text-xs text-app-textMuted">البيانات</label><button onclick="autoCalculateMeal()" class="text-[10px] bg-app-primary/20 text-app-primary px-2.5 py-1 rounded font-bold">حساب ذكي 🪄</button></div>
                <input type="text" id="edit-meal-stats" class="w-full bg-app-bg text-white p-3 rounded-xl border border-app-surfaceAlt text-right font-sans text-sm" dir="rtl">
            </div>
            <div><label class="text-xs text-app-textMuted">المكونات</label><textarea id="edit-meal-items" rows="4" class="w-full bg-app-bg text-white p-3 rounded-xl border border-app-surfaceAlt text-right resize-none font-sans" dir="rtl"></textarea></div>
            <input type="hidden" id="edit-meal-index">
            <div class="flex gap-2"><button onclick="saveMeal()" class="flex-1 bg-app-primary text-app-bg py-3 rounded-xl font-bold">حفظ</button><button onclick="closeMealEdit()" class="flex-1 bg-app-bg text-white py-3 rounded-xl border border-app-surfaceAlt">إلغاء</button></div>
            <button onclick="deleteMeal()" class="w-full bg-red-500/10 text-red-500 font-bold py-2.5 rounded-xl">حذف هذه الوجبة فوراً</button>
        </div>
    </div>

    <script>
        let nutritionData = {
            macros: { calories: 2100, protein: 170, carbs: 210, fats: 65 },
            meals: [
                { title: "الفطور", stats: "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون", items: [], pinned: false },
                { title: "الغداء", stats: "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون", items: [], pinned: false },
                { title: "العشاء", stats: "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون", items: [], pinned: false }
            ],
            supplements: [{ name: "فيتامين D3", dose: "حبة واحدة", time: "مع الفطور" }]
        };

        let workouts = [{ title: "اليوم 1 - تمارين", exercises: [{ name: "مشي سريع", reps: "20 دقيقة" }], note: "تمرن بنشاط." }];

        const todayStr = new Date().toISOString().split('T')[0];
        if (localStorage.getItem('hazm_last_date') !== todayStr) {
            localStorage.setItem('hazm_last_date', todayStr);
            localStorage.setItem('hazm_water', 0);
            nutritionData.meals.forEach(m => { if (!m.pinned) { m.stats = "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون"; m.items = []; } });
            localStorage.setItem('hazm_meals', JSON.stringify(nutritionData.meals));
        }

        window.currentWater = parseInt(localStorage.getItem('hazm_water')) || 0;
        window.updateWater = (v) => { window.currentWater = v; localStorage.setItem('hazm_water', v); renderNutrition(); };
        window.resetTodayCounter = () => {
            window.currentWater = 0;
            localStorage.setItem('hazm_water', 0);
            nutritionData.meals.forEach(m => { if (!m.pinned) { m.stats = "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون"; m.items = []; } });
            localStorage.setItem('hazm_meals', JSON.stringify(nutritionData.meals));
            renderNutrition();
            showToast("تم تصفير غير المثبت! 🔄");
        };

        window.togglePinMeal = (i) => {
            nutritionData.meals[i].pinned = !nutritionData.meals[i].pinned;
            localStorage.setItem('hazm_meals', JSON.stringify(nutritionData.meals));
            renderNutrition();
            showToast(nutritionData.meals[i].pinned ? "تم تثبيت الوجبة 📌" : "تم إلغاء التثبيت");
        };

        if(localStorage.getItem('hazm_macros')) nutritionData.macros = JSON.parse(localStorage.getItem('hazm_macros'));
        if(localStorage.getItem('hazm_meals')) nutritionData.meals = JSON.parse(localStorage.getItem('hazm_meals'));
        if(localStorage.getItem('hazm_workouts')) workouts = JSON.parse(localStorage.getItem('hazm_workouts'));

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('motivation-text').innerText = "أكل البيت والتزامك البسيط اليوم يصنعون معجزة شهر كامل. 🌟";
            document.getElementById('today-date').value = todayStr;
            renderNutrition();
            renderWorkouts();
            loadHistory();
        });

        function calculateTotals() {
            let tc = 0, tp = 0, tcar = 0, tf = 0;
            nutritionData.meals.forEach(m => {
                const s = m.stats || "";
                tc += parseInt((s.match(/(\d+)\s*سعرة/) || [])[1]) || 0;
                tp += parseInt((s.match(/(\d+)\s*غ?\s*برو/) || [])[1]) || 0;
                tcar += parseInt((s.match(/(\d+)\s*غ?\s*كارب/) || [])[1]) || 0;
                tf += parseInt((s.match(/(\d+)\s*غ?\s*دهون/) || [])[1]) || 0;
            });
            return { calories: tc, protein: tp, carbs: tcar, fats: tf };
        }

        // ==========================================
        // FOOLPROOF LINE-BY-LINE CALCULATOR
        // ==========================================
        window.autoCalculateMeal = function() {
            let rawText = document.getElementById('edit-meal-items').value || '';
            if (!rawText.trim()) {
                document.getElementById('edit-meal-stats').value = "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون";
                showToast("الوجبة فارغة", true);
                return;
            }

            let totalCal = 0, totalPro = 0, totalCarb = 0, totalFat = 0;
            const lines = rawText.split('\n');

            const foodDb = [
                { keys: ['بيض', 'بيضة', 'بيظ', 'بيضات'], p: 6.5, c: 0.5, f: 5.0, cal: 70, per: 'qty' },
                { keys: ['تونة', 'تونه'], p: 22, c: 0, f: 1.5, cal: 110, per: 'qty' },
                { keys: ['خبز بر', 'خبز اسمر', 'رغيف بر', 'رغيف اسمر'], p: 6, c: 32, f: 2, cal: 160, per: 'qty' },
                { keys: ['خبز ابيض', 'رغيف ابيض', 'خبز'], p: 6, c: 35, f: 1.5, cal: 170, per: 'qty' },
                { keys: ['كيري', 'جبن كيري', 'جبنه كيري'], p: 1.8, c: 1, f: 5, cal: 55, per: 'qty' },
                { keys: ['جبن', 'جبنة', 'شيدر', 'مثلثات'], p: 3.5, c: 1, f: 5, cal: 65, per: 'qty' },
                { keys: ['قوانص', 'قانصه'], p: 18, c: 0, f: 2.0, cal: 94, per: 100 },
                { keys: ['رز', 'ارز', 'رز ابيض'], p: 2.7, c: 28, f: 0.4, cal: 130, per: 100 },
                { keys: ['صدور دجاج', 'دجاج', 'صدر دجاج'], p: 31, c: 0, f: 3.6, cal: 165, per: 100 }
            ];

            lines.forEach(line => {
                let clean = line.toLowerCase().trim();
                if (!clean) return;

                let qty = 1;
                let isGrams = false;

                const nums = clean.match(/\d+(?:\.\d+)?/g);
                if (nums && nums.length > 0) {
                    qty = parseFloat(nums[0]);
                } else {
                    if (/بيضتين|بيضان|حبتين|علبتين|شريحتين|رغيفين/.test(clean)) qty = 2;
                    if (/ثلاث|3/.test(clean)) qty = 3;
                    if (/أربع|اربع|4/.test(clean)) qty = 4;
                }

                if (/غرام|جرام|مل|ml/.test(clean) || qty >= 20) isGrams = true;

                let matchedItem = null;
                for (let item of foodDb) {
                    for (let key of item.keys) {
                        if (clean.includes(key)) {
                            matchedItem = item;
                            break;
                        }
                    }
                    if (matchedItem) break;
                }

                if (matchedItem) {
                    let mult = 1;
                    if (matchedItem.per === 100) {
                        mult = isGrams ? (qty / 100) : (qty * 1.5);
                    } else {
                        mult = qty;
                    }
                    totalPro += matchedItem.p * mult;
                    totalCarb += matchedItem.c * mult;
                    totalFat += matchedItem.f * mult;
                    totalCal += matchedItem.cal * mult;
                }
            });

            totalCal = Math.round(totalCal);
            totalPro = Math.round(totalPro);
            totalCarb = Math.round(totalCarb);
            totalFat = Math.round(totalFat);

            document.getElementById('edit-meal-stats').value = `~${totalCal} سعرة | ${totalPro}غ برو | ${totalCarb}غ كارب | ${totalFat}غ دهون`;
            showToast("تم الحساب بدقة 100%! 🪄");
        };

        // RENDERING
        function renderNutrition() {
            const container = document.getElementById('nutrition-container');
            const totals = calculateTotals();
            let waterHtml = '';
            for(let i=1; i<=8; i++) {
                waterHtml += `<span onclick="updateWater(${i})" class="cursor-pointer text-2xl ${i <= window.currentWater ? 'text-app-water scale-110' : 'text-app-surfaceAlt opacity-50'}">💧</span>`;
            }

            let html = `
                <div class="bg-app-surface rounded-2xl p-4 mb-4 border border-app-surfaceAlt flex flex-col items-center">
                    <span class="text-xs font-bold text-white mb-2">متتبع الماء اليومي</span>
                    <div class="flex gap-2">${waterHtml}</div>
                </div>
                <div class="bg-app-surface rounded-2xl p-5 mb-4 border border-app-surfaceAlt shadow-lg relative">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="resetTodayCounter()" class="text-[10px] bg-red-500/10 text-red-400 px-2 py-1 rounded font-bold">🔄 تصفير غير المثبت</button>
                        <button onclick="openMacroEdit()" class="text-app-textMuted p-2 bg-app-bg rounded-xl border border-app-surfaceAlt">⚙️</button>
                    </div>
                    <div class="text-center mb-4">
                        <span class="text-[10px] bg-app-primary/10 text-app-primary px-3 py-1 rounded-full font-bold">الهدف اليومي</span>
                        <div class="text-4xl font-black text-white mt-1">${totals.calories} <span class="text-sm text-app-textMuted">/ ${nutritionData.macros.calories} Kcal</span></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="bg-app-bg p-2 rounded-xl">برو: ${totals.protein}/${nutritionData.macros.protein}g</div>
                        <div class="bg-app-bg p-2 rounded-xl">كارب: ${totals.carbs}/${nutritionData.macros.carbs}g</div>
                        <div class="bg-app-bg p-2 rounded-xl">دهون: ${totals.fats}/${nutritionData.macros.fats}g</div>
                    </div>
                </div>
            `;

            nutritionData.meals.forEach((m, idx) => {
                let itemsStr = m.items.map(it => `<li class="text-xs text-app-textMain">• ${it}</li>`).join('');
                html += `
                    <div class="bg-app-surface rounded-2xl p-4 mb-3 border border-app-surfaceAlt">
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-app-surfaceAlt border-dashed">
                            <div>
                                <h3 class="font-bold text-white text-sm">${m.title} ${m.pinned ? '📌' : ''}</h3>
                                <span class="text-[10px] text-app-textMuted bg-app-bg px-2 py-0.5 rounded">${m.stats}</span>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="togglePinMeal(${idx})" class="text-xs px-2 py-1 rounded border ${m.pinned ? 'bg-app-primary/20 text-app-primary border-app-primary' : 'bg-app-bg text-app-textMuted border-app-surfaceAlt'}">📌</button>
                                <button onclick="openMealEdit(${idx})" class="text-xs px-2 py-1 rounded bg-app-bg text-app-textMuted border border-app-surfaceAlt">✏️</button>
                            </div>
                        </div>
                        <ul class="space-y-1">${itemsStr}</ul>
                    </div>
                `;
            });

            html += `<button onclick="addNewMeal()" class="w-full bg-app-primary/10 text-app-primary font-bold py-3 rounded-xl border border-app-primary/30">+ إضافة وجبة</button>`;
            container.innerHTML = html;
        }

        function renderWorkouts() {
            document.getElementById('workouts-container').innerHTML = workouts.map(w => `
                <div class="bg-app-surface rounded-2xl p-4 border border-app-surfaceAlt mb-3">
                    <span class="text-app-primary text-xs font-bold">${w.title}</span>
                    <div class="mt-2 space-y-1">${w.exercises.map(e => `<div class="text-xs text-white">• ${e.name} (${e.reps})</div>`).join('')}</div>
                </div>
            `).join('');
        }

        // MODALS
        window.openMacroEdit = () => {
            document.getElementById('edit-cal').value = nutritionData.macros.calories;
            document.getElementById('edit-pro').value = nutritionData.macros.protein;
            document.getElementById('edit-carbs').value = nutritionData.macros.carbs;
            document.getElementById('edit-fats').value = nutritionData.macros.fats;
            document.getElementById('modal-macros').classList.remove('hidden');
        };
        window.closeMacroEdit = () => document.getElementById('modal-macros').classList.add('hidden');
        window.saveMacros = () => {
            nutritionData.macros.calories = parseInt(document.getElementById('edit-cal').value) || 0;
            nutritionData.macros.protein = parseInt(document.getElementById('edit-pro').value) || 0;
            nutritionData.macros.carbs = parseInt(document.getElementById('edit-carbs').value) || 0;
            nutritionData.macros.fats = parseInt(document.getElementById('edit-fats').value) || 0;
            localStorage.setItem('hazm_macros', JSON.stringify(nutritionData.macros));
            renderNutrition();
            closeMacroEdit();
            showToast("تم الحفظ!");
        };

        window.openMealEdit = (i) => {
            const m = nutritionData.meals[i];
            document.getElementById('edit-meal-title').value = m.title;
            document.getElementById('edit-meal-stats').value = m.stats;
            document.getElementById('edit-meal-items').value = m.items.join('\n');
            document.getElementById('edit-meal-index').value = i;
            document.getElementById('modal-meal').classList.remove('hidden');
        };
        window.closeMealEdit = () => document.getElementById('modal-meal').classList.add('hidden');
        window.saveMeal = () => {
            const i = document.getElementById('edit-meal-index').value;
            const items = document.getElementById('edit-meal-items').value.split('\n').filter(x => x.trim());
            nutritionData.meals[i] = {
                title: document.getElementById('edit-meal-title').value,
                stats: document.getElementById('edit-meal-stats').value,
                items,
                pinned: nutritionData.meals[i].pinned
            };
            localStorage.setItem('hazm_meals', JSON.stringify(nutritionData.meals));
            renderNutrition();
            closeMealEdit();
            showToast("تم الحفظ!");
        };
        window.addNewMeal = () => {
            nutritionData.meals.push({ title: "وجبة جديدة", stats: "0 سعرة | 0غ برو | 0غ كارب | 0غ دهون", items: [], pinned: false });
            openMealEdit(nutritionData.meals.length - 1);
        };
        window.deleteMeal = () => {
            const i = document.getElementById('edit-meal-index').value;
            nutritionData.meals.splice(i, 1);
            localStorage.setItem('hazm_meals', JSON.stringify(nutritionData.meals));
            renderNutrition();
            closeMealEdit();
            showToast("تم الحذف!");
        };

        function showToast(msg, err=false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = err ? '✕' : '✓';
            t.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-10', 'opacity-0'), 2500);
        }

        window.switchTab = (id) => {
            ['nutrition', 'workouts', 'tracking'].forEach(t => {
                document.getElementById('sec-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = 'py-2.5 text-sm font-bold rounded-lg text-app-textMuted hover:text-white';
            });
            document.getElementById('sec-' + id).classList.remove('hidden');
            document.getElementById('btn-' + id).className = 'py-2.5 text-sm font-bold rounded-lg bg-app-primary text-app-bg shadow-sm';
        };

        document.getElementById('btn-save').addEventListener('click', () => {
            const d = document.getElementById('today-date').value;
            let logs = JSON.parse(localStorage.getItem('hazm_logs') || '[]');
            logs = logs.filter(l => l.date !== d);
            logs.push({ date: d, weight: document.getElementById('input-weight').value });
            localStorage.setItem('hazm_logs', JSON.stringify(logs));
            loadHistory();
            showToast("تم حفظ اليوم!");
        });

        function loadHistory() {
            let logs = JSON.parse(localStorage.getItem('hazm_logs') || '[]');
            const container = document.getElementById('history-container');
            if(logs.length === 0) { document.getElementById('history-section').classList.add('hidden'); return; }
            document.getElementById('history-section').classList.remove('hidden');
            container.innerHTML = logs.map(l => `<div class="bg-app-surface p-3 rounded-xl flex justify-between text-xs"><span>${l.date}</span><span class="text-app-primary font-bold">${l.weight ? l.weight + ' kg' : ''}</span></div>`).join('');
        }
    </script>
</body>
</html>
